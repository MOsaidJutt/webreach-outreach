<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Outreach Automation{% endblock %} | WebReach</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="/static/css/custom.css" rel="stylesheet" />
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <i class="bi bi-globe2"></i>
    <span>WebReach</span>
  </div>
  <nav class="sidebar-nav">
    <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="/leads" class="nav-link {% if '/leads' in request.path and '/leads/' not in request.path %}active{% endif %}">
      <i class="bi bi-people-fill"></i> Leads
    </a>
    <a href="/conversations" class="nav-link {% if '/conversations' in request.path %}active{% endif %}">
      <i class="bi bi-chat-dots-fill"></i> Conversations
    </a>
    <a href="/scraping" class="nav-link {% if '/scraping' in request.path %}active{% endif %}">
      <i class="bi bi-search"></i> Scraping Jobs
    </a>
    <a href="/ai-chat" class="nav-link {% if '/ai-chat' in request.path %}active{% endif %}">
      <i class="bi bi-chat-dots-fill"></i> AI Chat Test
    </a>
    <a href="/admin" class="nav-link {% if '/admin' in request.path %}active{% endif %}">
      <i class="bi bi-sliders"></i> Admin
    </a>
    <a href="/settings" class="nav-link {% if '/settings' in request.path %}active{% endif %}">
      <i class="bi bi-gear-fill"></i> Settings
    </a>
  </nav>
  <div class="sidebar-footer">
    <small class="text-muted">WebReach v1.0</small>
  </div>
</div>

<!-- Main content -->
<div class="main-content">
  <div class="topbar d-flex align-items-center justify-content-between mb-4">
    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-sm btn-light d-lg-none" id="sidebarToggle">
        <i class="bi bi-list"></i>
      </button>
      <h4 class="mb-0 fw-semibold">{% block page_title %}Dashboard{% endblock %}</h4>
    </div>
    <div class="d-flex gap-2">
      <a href="/api/leads/export?format=csv" class="btn btn-sm btn-outline-secondary" target="_blank">
        <i class="bi bi-download"></i> Export CSV
      </a>
      <a href="/api/leads/export?format=excel" class="btn btn-sm btn-outline-success" target="_blank">
        <i class="bi bi-file-earmark-excel"></i> Export Excel
      </a>
    </div>
  </div>

  {% block content %}{% endblock %}
</div>

<!-- Toast Notifications -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
  // Sidebar toggle for mobile
  document.getElementById("sidebarToggle")?.addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
  });

  // Global toast helper
  function showToast(message, type = "success") {
    const id = "toast-" + Date.now();
    const icon = type === "success" ? "bi-check-circle-fill text-success" : "bi-exclamation-circle-fill text-danger";
    const html = `
      <div id="${id}" class="toast align-items-center border-0 shadow" role="alert">
        <div class="d-flex">
          <div class="toast-body d-flex align-items-center gap-2">
            <i class="bi ${icon}"></i> ${message}
          </div>
          <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>`;
    document.getElementById("toastContainer").insertAdjacentHTML("beforeend", html);
    const el = document.getElementById(id);
    const toast = new bootstrap.Toast(el, { delay: 4000 });
    toast.show();
    el.addEventListener("hidden.bs.toast", () => el.remove());
  }

  // Global API helper
  async function api(method, url, body = null) {
    const opts = {
      method,
      headers: { "Content-Type": "application/json" },
    };
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch(url, opts);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || "Request failed");
    return data;
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
