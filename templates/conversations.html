{% extends "base.html" %}
{% block title %}Conversations{% endblock %}
{% block page_title %}Conversations{% endblock %}

{% block content %}
<style>
  .conv-shell {
    height: calc(100vh - 140px);
    min-height: 540px;              /* never collapse to nothing on a short window */
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 8px rgba(0,0,0,.08);
    /* Bootstrap's .row is a WRAPPING flex container, so its single flex line
       takes its height from the tallest item rather than from this fixed
       height. The columns therefore grew to fit all their content and were
       simply clipped -- no scrollbar appeared anywhere on the page. Turning
       wrapping off makes align-items:stretch size them to the shell instead. */
    flex-wrap: nowrap;
  }
  /* height:100% pins the columns to the shell; min-height:0 then allows the
     inner lists to shrink below their content so overflow-auto engages. */
  .conv-list-col   { min-width: 320px; height: 100%; min-height: 0; }
  .conv-thread-col { height: 100%; min-height: 0; overflow: hidden; }

  #convList  { overscroll-behavior: contain; }
  /* The message area must keep a usable height however tall the header,
     compose box and status bar around it end up being. */
  #msgThread { min-height: 220px; overscroll-behavior: contain; }

  /* The filter row wraps to several lines and was eating the list's height. */
  .conv-filters { max-height: 4.6rem; overflow-y: auto; }

  /* Below lg the columns stack, and a fixed viewport height would clip
     everything with no way to reach it. Let the page scroll normally instead. */
  @media (max-width: 991.98px) {
    .conv-shell      { height: auto; min-height: 0; overflow: visible; flex-wrap: wrap; }
    .conv-list-col   { height: 65vh; }
    /* Let the thread grow and the page scroll, rather than squeezing the
       messages into whatever is left after the surrounding controls. */
    .conv-thread-col { height: auto; min-height: 70vh; overflow: visible; }
    #msgThread       { min-height: 50vh; }
  }
</style>

<div class="row g-0 conv-shell">

  <!-- Left: Conversation list -->
  <div class="col-lg-4 conv-list-col border-end bg-white d-flex flex-column">

    <!-- Search + filter -->
    <div class="p-3 border-bottom flex-shrink-0">
      <div class="input-group input-group-sm mb-2">
        <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
        <input type="text" class="form-control border-start-0" id="convSearch" placeholder="Search conversations..." oninput="filterList()" />
      </div>
      <div class="d-flex gap-1 flex-wrap conv-filters">
        <button class="btn btn-xs btn-primary active-filter" onclick="setFilter('all', this)">All leads</button>
        <button class="btn btn-xs btn-outline-secondary" onclick="setFilter('with_messages', this)">Has messages</button>
        <button class="btn btn-xs btn-outline-secondary" onclick="setFilter('replied', this)">Replied</button>
        <button class="btn btn-xs btn-outline-warning" onclick="setFilter('interested', this)">Interested</button>
        <button class="btn btn-xs btn-outline-danger" onclick="setFilter('not_interested', this)">Not Interested</button>
        <button class="btn btn-xs btn-outline-secondary" onclick="setFilter('not_contacted', this)">Not Contacted</button>
        <button class="btn btn-xs btn-outline-secondary" onclick="setFilter('manual', this)">Manual Mode</button>
      </div>
      <div class="d-flex align-items-center gap-2 mt-2">
        <span class="small text-muted" id="convTotal"></span>
        <button class="btn btn-xs btn-outline-primary ms-auto" onclick="syncAllFromGHL()"
                title="Pull recent message history from GHL for every linked lead">
          <i class="bi bi-arrow-repeat"></i> Sync from GHL
        </button>
      </div>
      <div class="small text-muted mt-1" id="syncStatus"></div>
    </div>

    <!-- List -->
    <div class="overflow-auto flex-grow-1" id="convList">
      <div class="text-center text-muted py-5 small">Loading...</div>
    </div>

    <!-- Paging: every lead is reachable, not just the first page -->
    <div class="p-2 border-top d-flex align-items-center justify-content-between flex-shrink-0">
      <button class="btn btn-xs btn-outline-secondary" id="convPrev" onclick="changePage(-1)">&larr; Prev</button>
      <span class="small text-muted" id="convPageInfo"></span>
      <button class="btn btn-xs btn-outline-secondary" id="convNext" onclick="changePage(1)">Next &rarr;</button>
    </div>
  </div>

  <!-- Right: Message thread -->
  <div class="col conv-thread-col bg-white d-flex flex-column" id="threadPanel">
    <div class="d-flex flex-column align-items-center justify-content-center h-100 text-muted">
      <i class="bi bi-chat-dots fs-1 opacity-25 mb-2"></i>
      <p class="small">Select a conversation to view messages</p>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
let allLeads = [];
let currentFilter = 'all';
let currentLead = null;

const STATUS_BADGE = {
  not_contacted:'secondary', message_sent:'info', replied:'primary',
  interested:'warning', not_interested:'danger', opted_out:'dark',
  website_sent:'success', converted:'success',
};

let currentPage = 1;
let totalPages = 1;
let searchTimer = null;

window.addEventListener('DOMContentLoaded', () => { loadConversations(); pollSync(); });

// Filtering, searching and paging all happen on the server now. The page used
// to pull 500 leads and hide every 'not_contacted' one, so most of the list
// could never be reached.
async function loadConversations() {
  const search = document.getElementById('convSearch').value.trim();
  const params = new URLSearchParams({ page: currentPage, per_page: 100 });
  if (search) params.set('search', search);
  if (currentFilter === 'manual' || currentFilter === 'with_messages') {
    params.set('only', currentFilter);
  } else if (currentFilter !== 'all') {
    params.set('status', currentFilter);
  }

  try {
    const data = await api('GET', '/api/leads/conversation-list?' + params);
    allLeads = data.leads;
    totalPages = data.pages || 1;
    document.getElementById('convTotal').textContent =
      `${data.total} lead${data.total === 1 ? '' : 's'}`;
    document.getElementById('convPageInfo').textContent =
      `Page ${data.page} of ${totalPages}`;
    document.getElementById('convPrev').disabled = data.page <= 1;
    document.getElementById('convNext').disabled = data.page >= totalPages;
    renderList();
  } catch (e) {
    document.getElementById('convList').innerHTML =
      `<div class="text-center text-danger py-5 small">${esc(e.message)}</div>`;
  }
}

function changePage(delta) {
  const next = currentPage + delta;
  if (next < 1 || next > totalPages) return;
  currentPage = next;
  loadConversations();
}

function setFilter(f, btn) {
  currentFilter = f;
  currentPage = 1;
  document.querySelectorAll('.active-filter').forEach(b => {
    b.className = b.className.replace('btn-primary','btn-outline-secondary').replace(' active-filter','');
  });
  btn.className = btn.className.replace('btn-outline-secondary','btn-primary') + ' active-filter';
  loadConversations();
}

function filterList() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentPage = 1; loadConversations(); }, 300);
}

function renderList() {
  const leads = allLeads;
  const el = document.getElementById('convList');
  if (!leads.length) {
    el.innerHTML = '<div class="text-center text-muted py-5 small">No leads match this filter</div>';
    return;
  }

  el.innerHTML = leads.map(l => `
    <div class="conv-item px-3 py-2 border-bottom cursor-pointer ${currentLead?.id === l.id ? 'bg-primary bg-opacity-10' : ''}"
         onclick="openThread(${l.id})" style="cursor:pointer;">
      <div class="d-flex justify-content-between align-items-start gap-1">
        <div class="fw-semibold text-truncate small" style="max-width:160px">${esc(l.business_name||'Unknown')}</div>
        <div class="d-flex gap-1 flex-shrink-0">
          ${l.ai_paused ? '<span class="badge bg-warning text-dark" style="font-size:9px">Manual</span>' : ''}
          <span class="badge bg-${STATUS_BADGE[l.status]||'secondary'}" style="font-size:9px">${l.status.replace(/_/g,' ')}</span>
        </div>
      </div>
      <div class="text-muted" style="font-size:11px">
        ${l.phone||'No phone'}
        ${l.send_queued ? ' · <span class="text-primary">queued to send</span>' : ''}
        ${!l.imported_to_ghl ? ' · <span class="text-warning">not in GHL</span>' : ''}
      </div>
      <div class="text-truncate ${l.awaiting_reply ? 'fw-semibold text-dark' : 'text-muted'}"
           style="font-size:11px; max-width:260px">
        ${l.last_message
            ? (l.last_direction === 'inbound' ? '← ' : '→ ') + esc(l.last_message)
            : 'No messages yet'}
      </div>
    </div>`).join('');
}

async function openThread(leadId) {
  // Sync this thread from GHL as it opens, so what is shown is GHL's history
  // rather than only the messages this app happens to have recorded.
  const data = await api('GET', `/api/leads/${leadId}?sync=1`);
  const l = data.lead;
  currentLead = l;
  renderList();

  const msgs = l.conversations || [];
  const panel = document.getElementById('threadPanel');

  panel.innerHTML = `
    <!-- Header -->
    <div class="p-3 border-bottom d-flex align-items-center justify-content-between bg-white flex-shrink-0">
      <div>
        <div class="fw-semibold">${esc(l.business_name||'Unknown')}</div>
        <div class="small text-muted d-flex align-items-center gap-2 flex-wrap mt-1">
          <span>${l.phone||''}</span>
          <span class="badge bg-${STATUS_BADGE[l.status]||'secondary'}">${l.status.replace(/_/g,' ')}</span>
          <span class="badge ${l.ai_paused ? 'bg-warning text-dark' : 'bg-success'}" id="aiStatusBadge">
            ${l.ai_paused ? '<i class="bi bi-person-fill me-1"></i>Manual Mode' : '<i class="bi bi-robot me-1"></i>AI Active'}
          </span>
          <button class="btn btn-xs btn-outline-secondary" onclick="resyncThread(${l.id})"
                  title="Re-read this conversation from GHL">
            <i class="bi bi-arrow-repeat"></i> Sync
          </button>
          <span class="text-muted" id="threadSyncNote" style="font-size:11px"></span>
        </div>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-xs ${l.ai_paused ? 'btn-success' : 'btn-warning'}" id="takeoverBtn"
                onclick="${l.ai_paused ? `resumeAI(${l.id})` : `takeOver(${l.id})`}">
          <i class="bi bi-${l.ai_paused ? 'robot' : 'person-fill'} me-1"></i>
          ${l.ai_paused ? 'Resume AI' : 'Take Over'}
        </button>
        <a href="/leads/${l.id}" class="btn btn-xs btn-outline-primary" target="_blank">
          <i class="bi bi-person"></i> Lead
        </a>
        ${l.google_maps_url ? `<a href="${l.google_maps_url}" class="btn btn-xs btn-outline-secondary" target="_blank"><i class="bi bi-map"></i></a>` : ''}
        <button class="btn btn-xs btn-outline-danger" onclick="deleteConvo(${l.id})">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>

    <!-- Manual mode banner -->
    ${l.ai_paused ? `
    <div class="alert alert-warning py-2 px-3 mb-0 rounded-0 flex-shrink-0 small border-0 border-bottom border-warning">
      <i class="bi bi-hand-index-thumb-fill me-1"></i>
      <strong>Manual Mode</strong> — AI is paused. You're in control. Click <strong>Resume AI</strong> to hand back to the bot.
    </div>` : ''}

    <!-- Messages -->
    <div class="p-3 overflow-auto" id="msgThread"
         style="background:#f8f9fa; flex:1 1 0;">
      ${msgs.length ? msgs.map(m => renderMsg(m)).join('') : '<div class="text-center text-muted py-5">No messages yet</div>'}
    </div>

    <!-- Manual compose -->
    <div class="p-2 border-top bg-white flex-shrink-0">
      <div class="input-group">
        <textarea class="form-control" id="manualMsg" rows="2"
          placeholder="Type a manual message to send via GHL SMS..."
          style="resize:none; font-size:13px;"
          onkeydown="if(event.ctrlKey&&event.key==='Enter'){event.preventDefault();sendManual(${l.id})}"></textarea>
        <button class="btn btn-primary px-3" onclick="sendManual(${l.id})" title="Send (Ctrl+Enter)">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
      <div class="small text-muted mt-1">Ctrl+Enter to send · Sending pauses the AI automatically</div>
    </div>

    <!-- Status + notes bar -->
    <div class="p-3 border-top bg-white flex-shrink-0">
      <div class="row g-2 align-items-center">
        <div class="col-auto small text-muted">Status:</div>
        <div class="col-auto">
          <select class="form-select form-select-sm" id="threadStatus" onchange="updateStatus(${l.id})">
            ${['not_contacted','message_sent','replied','interested','not_interested','opted_out','website_sent','converted'].map(s =>
              `<option value="${s}" ${l.status===s?'selected':''}>${s.replace(/_/g,' ')}</option>`
            ).join('')}
          </select>
        </div>
        <div class="col">
          <input type="text" class="form-control form-control-sm" id="noteInput" placeholder="Add a note..." value="${esc(l.notes||'')}" />
        </div>
        <div class="col-auto">
          <button class="btn btn-sm btn-primary" onclick="saveNote(${l.id})">Save</button>
        </div>
      </div>
    </div>`;

  setTimeout(() => {
    const t = document.getElementById('msgThread');
    if (t) t.scrollTop = t.scrollHeight;
  }, 50);
}

function renderMsg(m) {
  const isOut    = m.direction === 'outbound';
  const isManual = m.status === 'sent_manual';
  const time     = m.created_at ? m.created_at.substring(0,16).replace('T',' ') : '';
  const label    = isOut ? (isManual ? 'You (Manual)' : 'You (AI)') : 'Lead';
  const bubble   = isOut
    ? (isManual ? 'bg-success text-white' : 'bg-primary text-white')
    : 'bg-white border shadow-sm';
  return `
    <div class="mb-3 d-flex ${isOut ? 'justify-content-end' : 'justify-content-start'}">
      <div style="max-width:72%">
        <div class="px-3 py-2 rounded-3 ${bubble}"
             style="font-size:.875rem; white-space:pre-wrap">${esc(m.message||'')}</div>
        <div class="small text-muted mt-1 ${isOut?'text-end':''}">${label} · ${time}</div>
      </div>
    </div>`;
}

async function takeOver(leadId) {
  try {
    await api('POST', `/api/leads/${leadId}/pause-ai`);
    showToast('AI paused — you have taken over this conversation');
    await openThread(leadId);
    document.getElementById('manualMsg')?.focus();
  } catch(e) { showToast(e.message, 'error'); }
}

async function resumeAI(leadId) {
  if (!confirm('Hand this conversation back to the AI? The bot will respond to future messages again.')) return;
  try {
    await api('POST', `/api/leads/${leadId}/resume-ai`);
    showToast('AI resumed — bot will handle future replies');
    await openThread(leadId);
  } catch(e) { showToast(e.message, 'error'); }
}

async function sendManual(leadId) {
  const el = document.getElementById('manualMsg');
  const msg = el?.value.trim();
  if (!msg) return;
  try {
    await api('POST', `/api/leads/${leadId}/send-manual-sms`, { message: msg });
    el.value = '';
    showToast('Sent via GHL · AI paused for this conversation');
    await openThread(leadId);
  } catch(e) { showToast(e.message, 'error'); }
}

async function deleteConvo(leadId) {
  if (!confirm("Delete this lead and all its conversation history? This cannot be undone.")) return;
  try {
    await api("DELETE", `/api/leads/${leadId}`);
    showToast("Deleted");
    document.getElementById("threadPanel").innerHTML = `
      <div class="d-flex flex-column align-items-center justify-content-center h-100 text-muted">
        <i class="bi bi-chat-dots fs-1 opacity-25 mb-2"></i>
        <p class="small">Select a conversation to view messages</p>
      </div>`;
    currentLead = null;
    loadConversations();
  } catch(e) { showToast(e.message, "error"); }
}

async function updateStatus(leadId) {
  const status = document.getElementById('threadStatus').value;
  await api('PUT', `/api/leads/${leadId}/status`, { status });
  showToast('Status updated');
  loadConversations();
}

async function saveNote(leadId) {
  const notes = document.getElementById('noteInput').value;
  await api('PUT', `/api/leads/${leadId}/notes`, { notes });
  showToast('Note saved');
}

// ─── GHL sync ──────────────────────────────────────────────────────────────

async function resyncThread(leadId) {
  const note = document.getElementById("threadSyncNote");
  if (note) note.textContent = "syncing…";
  try {
    const d = await api("POST", `/api/leads/${leadId}/sync-ghl`);
    await openThread(leadId);
    const n = document.getElementById("threadSyncNote");
    if (n) {
      n.textContent = d.sync.error
        ? d.sync.error
        : (d.sync.added ? `${d.sync.added} new message(s)` : "up to date");
    }
  } catch (e) {
    showToast(e.message, "error");
    if (note) note.textContent = "";
  }
}

async function syncAllFromGHL() {
  if (!confirm("Pull recent message history from GHL for your linked leads?\n\n"
    + "This only reads from GHL — nothing is sent and no lead is changed.")) return;
  try {
    const d = await api("POST", "/api/leads/sync-ghl-bulk", { limit: 200 });
    showToast(d.message);
    pollSync();
  } catch (e) { showToast(e.message, "error"); }
}

let syncTimer = null;
async function pollSync() {
  clearInterval(syncTimer);
  const el = document.getElementById("syncStatus");
  const tick = async () => {
    try {
      const s = await api("GET", "/api/leads/sync-ghl-status");
      if (!s.running && !s.total) { el.textContent = ""; clearInterval(syncTimer); return; }
      el.innerHTML = s.running
        ? `<i class="bi bi-arrow-repeat"></i> Syncing ${s.done}/${s.total} — ${s.added} message(s) added`
        : `<i class="bi bi-check-circle text-success"></i> Sync finished — ${s.added} message(s) added`
          + (s.errors.length ? ` · ${s.errors.length} problem(s)` : "");
      if (!s.running) { clearInterval(syncTimer); loadConversations(); }
    } catch (e) { clearInterval(syncTimer); }
  };
  await tick();
  syncTimer = setInterval(tick, 4000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
{% endblock %}
